name: CI

on:
    push:
    pull_request:

jobs:
    go:
        name: Go
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            VOLTER_REDIS_URL: redis://localhost:6379/0

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Download modules
              run: go mod download

            - name: Check formatting
              run: test -z "$(gofmt -l .)"

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test -race ./...

            - name: Build
              run: go build ./...
